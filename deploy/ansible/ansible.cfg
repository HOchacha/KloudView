[defaults]
inventory = inventory/hosts.yml
roles_path = roles
# Kept outside the repository, so it cannot be committed by accident. It opens
# inventory/group_vars/all/vault.yml, which deploy/ansible/gen-vault.sh creates.
vault_password_file = ~/.ansible/kloudview-vault-pass
interpreter_python = auto_silent
stdout_callback = default
result_format = yaml

[ssh_connection]
pipelining = true
